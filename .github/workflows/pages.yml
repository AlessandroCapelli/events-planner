name: Deploy GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - name: Generate config.js
              env:
                  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
                  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  from urllib.parse import urlparse

                  url = os.environ['SUPABASE_URL'].rstrip('/')
                  key = os.environ['SUPABASE_ANON_KEY']
                  parsed = urlparse(url)
                  if parsed.scheme != 'https' or not parsed.netloc or not key:
                      raise SystemExit('SUPABASE_URL e SUPABASE_ANON_KEY devono essere configurati')
                  config = {'supabaseUrl': url, 'supabaseAnonKey': key}
                  Path('web/config.js').write_text('window.CONFIG = ' + json.dumps(config) + ';\n', encoding='utf-8')
                  PY

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: web
            - id: deployment
              uses: actions/deploy-pages@v4
